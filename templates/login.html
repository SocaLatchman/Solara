{% extends 'base.html' %}
{% block content %}
<div class="flex-container">
    <div class="left-content">
        <img src="{{ url_for('static', filename='images/logo.svg')}}" id="logo" alt="logo image">
        <div id="login">
          <h3>Welcome back</h3>  
          <form method="POST">
            <input type="email" name="email" placeholder="johndoe@gmail.com">
            <input type="password" name="password" placeholder="********">
            <label><input type="checkbox" name="rememberme" unchecked>Remember me</label>
            <a href="{{ url_for('forgot_password')}}">Forgot password?</a>
            <input type="submit" value="Log in">
          </form>
        </div>
    </div>
    <div class="right-content">
       <img src="{{ url_for('static', filename='images/solar-panels.jpg')}}" alt="Solar panel image">
    </div>
</div>
{% endblock %}
